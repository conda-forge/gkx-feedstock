schema_version: 1

context:
  version: "2.8.1"
  python_min: "3.11"

package:
  name: gkx
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/gkx/gkx-${{ version }}.tar.gz
  sha256: 0f81a4fc5e9acbf8c341f2e7a43e4bdc0a5b645779a4f8e712ef98ca728b063f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - gkx = gkx.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - jax >=0.10.1
    - jaxlib >=0.10.1
    - matplotlib-base
    - scipy
    - netcdf4
    - solvax >=0.33.0
    - booz-xform-jax >=0.4.3
    - tqdm

tests:
  - python:
      imports:
        - gkx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - gkx --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: Gyrokinetic Spectral Solver of Plasma Turbulence
  description: |
    GKX is a JAX-native gyrokinetic solver designed for differentiability,
    high-performance accelerator execution, and advanced stellarator
    optimization.
    The code employs a Hermite-Laguerre velocity space, Fourier perpendicular
    coordinates, and field-aligned flux-tube geometry to simulate linear and
    nonlinear electrostatic and electromagnetic turbulence in magnetized
    plasmas.
  license: MIT
  license_file: LICENSE
  homepage: https://gkx.readthedocs.io/
  repository: https://github.com/uwplasma/GKX
  documentation: https://gkx.readthedocs.io/

extra:
  recipe-maintainers:
    - rogeriojorge
    - matthewfeickert
    - RKHashmani
